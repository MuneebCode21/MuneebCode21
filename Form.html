    <form action="index.php" method="POST">
        <label for="Username"><b><h3>
            Username: 
        </h3></b></label>
        <input type="text" id="Username" placeholder="Randomdude12" minlength="6" maxlength="15" required>
        <label for="Password"><b><h3>
            Password:
        </h3></b></label>
        <input type="password" id="Password"  minlength="6" maxlength="15" required>
        <label for="Email"><b><h3>
            Email:
        </h3></b></label>
        <input type="email" id="Email" placeholder="Randomdude@gmail.com"  required>
        <label for="Phone No"><b><h3>
            Phone No:
        </h3></b></label>
        <input type="tel" id="Phone No" placeholder="0331-11111111" pattern="[0-9]{4}-[0-9]{8}" required>
        <label for="Birth"><b><h3>
            Date Of Birth:
        </h3></b></label>
        <input type="date" id="Birth" required>
        <label><b><h3>
            Radio
        </h3></b></label>

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr.">
        <label for="Ms.">Ms.</label>

        <label for="Dr.">Dr.</label>
        <input type="radio" id="Dr.">

        <br>

        <label for id="Slapped"><b><h2>
            Want to get slapped lol?
        </b></h2></label>
        <select id="Slapped">
            <option value="Oh yeah I want to">Oh yeah I want to</option>
            <option value="Maybe IDK">Maybe IDK</option>
            <option value="NAAA Miss">NAAA Miss</option>
        </select>

        <label for="payment"><b><h3>
            Payment:
        </h3></b></label>
        <select id="payment" required>
            <option value="Visa">Visa</option>
            <option value="MasterCard">MasterCard</option>
            <option value="Giftcard">GiftCard</option>
        </select>
        
        <label for="Confirmation"><b><h3>
            Confirmation;
        </h3></b></label>
        <input type="checkbox" id="Confirmation" required>

        <label for="File"><b><h3>
            IF U WANNA ATTACH SOMETHING THEN JUS GO WITH IT
        </h3></b></label>
        <input type="file" id="File" accept="Images/jpeg">

        <br><br><hr>

        <input type="Reset">

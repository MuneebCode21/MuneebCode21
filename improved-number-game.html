<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #667eea;
            font-size: 1.5em;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #ddd;
            border-radius: 10px;
            text-align: center;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="number"]:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .message.hidden {
            opacity: 0;
        }

        .message.too-low {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }

        .message.too-high {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .message.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            animation: celebrate 0.5s ease;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .history {
            margin-top: 25px;
            text-align: left;
        }

        .history-title {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .guess-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .guess-item {
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1em;
            transition: transform 0.2s;
        }

        .guess-item:hover {
            transform: scale(1.05);
        }

        .hint {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            color: #1565c0;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 Guess the Number</h1>
        <p>Enter a number between 1 and 50:</p>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Attempts</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Best Score</div>
                <div class="stat-value" id="bestScore">-</div>
            </div>
        </div>

        <input type="number" id="guessInput" min="1" max="50" placeholder="Enter your guess">
        
        <button onclick="checkGuess()" id="submitBtn">Submit Guess</button>
        <button class="reset-btn" onclick="resetGame()">New Game</button>
        
        <div class="message hidden" id="message"></div>

        <div class="hint" id="hint">💡 Make your first guess to start!</div>

        <div class="history">
            <div class="history-title">Previous Guesses:</div>
            <div class="guess-list" id="guessList">
                <span style="color: #999;">No guesses yet</span>
            </div>
        </div>
    </div>

    <script>
        // Game variables
        let targetNumber;
        let attempts;
        let guesses;
        let bestScore = localStorage.getItem('bestScore') || null;
        let gameOver = false;

        // Initialize game
        function initGame() {
            targetNumber = Math.floor(Math.random() * 50) + 1;
            attempts = 0;
            guesses = [];
            gameOver = false;
            updateDisplay();
            
            // Reset UI
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message hidden';
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').disabled = false;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('guessList').innerHTML = '<span style="color: #999;">No guesses yet</span>';
            document.getElementById('hint').textContent = '💡 Make your first guess to start!';
        }

        // Update display
        function updateDisplay() {
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('bestScore').textContent = bestScore ? bestScore : '-';
        }

        // Main game logic
        function checkGuess() {
            if (gameOver) return;

            const input = document.getElementById('guessInput');
            const guess = parseInt(input.value);
            const messageEl = document.getElementById('message');
            const hintEl = document.getElementById('hint');

            // Validation
            if (isNaN(guess)) {
                showMessage('Please enter a number!', 'error');
                return;
            }

            if (guess < 1 || guess > 50) {
                showMessage('Number must be between 1 and 50!', 'error');
                return;
            }

            if (guesses.includes(guess)) {
                showMessage('You already guessed that number!', 'error');
                return;
            }

            // Update game state
            attempts++;
            guesses.push(guess);
            updateDisplay();
            updateGuessList();

            // Check guess
            if (guess === targetNumber) {
                showMessage(`🎉 Correct! You won in ${attempts} ${attempts === 1 ? 'attempt' : 'attempts'}!`, 'correct');
                hintEl.textContent = `🏆 The number was ${targetNumber}!`;
                gameOver = true;
                input.disabled = true;
                document.getElementById('submitBtn').disabled = true;

                // Update best score
                if (!bestScore || attempts < bestScore) {
                    bestScore = attempts;
                    localStorage.setItem('bestScore', bestScore);
                    updateDisplay();
                    setTimeout(() => {
                        hintEl.textContent = `🌟 New best score: ${bestScore} attempts!`;
                    }, 1500);
                }
            } else if (guess < targetNumber) {
                showMessage('📈 Too low! Try a higher number.', 'too-low');
                updateHint(guess, targetNumber);
            } else {
                showMessage('📉 Too high! Try a lower number.', 'too-high');
                updateHint(guess, targetNumber);
            }

            input.value = '';
            input.focus();
        }

        // Show message with animation
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
        }

        // Update hint based on how close the guess is
        function updateHint(guess, target) {
            const hintEl = document.getElementById('hint');
            const difference = Math.abs(guess - target);

            if (difference <= 3) {
                hintEl.textContent = '🔥 You\'re very hot!';
            } else if (difference <= 7) {
                hintEl.textContent = '♨️ Getting warm!';
            } else if (difference <= 15) {
                hintEl.textContent = '❄️ Getting cold...';
            } else {
                hintEl.textContent = '🧊 You\'re freezing!';
            }
        }

        // Update guesses list
        function updateGuessList() {
            const list = document.getElementById('guessList');
            list.innerHTML = guesses.map(g => `<span class="guess-item">${g}</span>`).join('');
        }

        // Reset game
        function resetGame() {
            initGame();
        }

        // Enter key support
        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });

        // Start game on load
        initGame();
    </script>
</body>
</html>
